# Scripted responses for the `fake` provider: offline, deterministic, free.
#
# They exist so `tests/test_pyvrp_example.py` can drive the whole loop on this
# example without a network and without a key. Each one is a *structurally*
# different configuration rather than a nudged constant -- a different operator
# set, a different penalty schedule, a different restart policy -- because that
# is what this example asks a real model for, and a scripted answer that only
# moved a number would demonstrate the wrong thing.
#
# Every response replaces the whole evolve block, so each one is self-contained
# and does not rely on the seed block's `# PARAMS:` constants.
#
# No claim is made that any of these beats PyVRP's defaults. Whether they do is
# the question the real run is for; the offline run only has to show that the
# loop proposes a different configuration and records what it scored.

# ---------------------------------------------------------------- keyed ----

