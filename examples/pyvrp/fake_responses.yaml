    def configure(data, time_limit, seed):
        """Default operators, but restart often and accept more worsening moves."""
        return SolveParams(
            ils=IteratedLocalSearchParams(
                num_iters_no_improvement=5_000,
                history_length=2_000,
                exhaustive_on_best=True,
            ),
            penalty=PenaltyParams(),
            neighbourhood=NeighbourhoodParams(num_neighbours=64),
            operators=list(OPERATORS),
            perturbation=PerturbationParams(min_perturbations=2, max_perturbations=30),
            display_interval=1e9,
        )
    ```

