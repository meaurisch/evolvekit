# Scripted responses for the `fake` provider: offline, deterministic, free.
#
# They exist so `tests/test_circlepacking.py` can drive the whole loop on this
# example without a network. Two of them are genuine improvements on the
# 2.5414 seed, and both are deterministic -- fixed iteration counts rather than
# a wall-clock loop -- so the test's numbers are the same on every machine.
# `deadline()` / `expired()` are still consulted, because a real candidate
# should respect `TIME_BUDGET_S` and the example ought to show how.

