# The meta-scratchpad refresh.
- when: "keeping the running notes"
  response: |
    - The uniform 5x5 grid is a hard local optimum: every circle is blocked by
      a wall and by two neighbours at once, so no single circle can grow.
    - The only thing that has paid is letting the centres move. Relaxation
      under a penalty on overlap, with the penalty raised in stages, beats any
      fixed arrangement tried so far.
    - Longer schedules with more stages beat short ones. The last stage matters
      most: it is what makes the packing legal without shrinking it.
    - Equal radii are not the target. The best packings found have circles of
      several sizes.

# The scheduled big step: the same idea, run for longer.
- when: "scheduled big step"
  response: |
    ```python
    def construct_packing():
        """Penalty relaxation on a six-stage schedule.

        Same mechanism as the current block, but the penalty ladder is longer
        and finishes much stiffer, so the final packing is close to feasible
        before the referee ever touches it.
        """
        schedule = (
            (5.0, 0.02, 200),
            (25.0, 0.01, 300),
            (125.0, 0.004, 400),
            (625.0, 0.0015, 500),
            (3125.0, 0.0004, 600),
            (15625.0, 0.0001, 700),
        )
        return _relax(schedule)


    def _grid_start():
        xs, ys, rs = [], [], []
        for i in range(5):
            for j in range(5):
                xs.append(0.1 + 0.2 * i)
                ys.append(0.1 + 0.2 * j)
                rs.append(0.1)
        xs.append(0.2)
        ys.append(0.2)
        rs.append(0.0414)
        return xs, ys, rs


    def _relax(schedule):
        xs, ys, rs = _grid_start()
        stop_at = deadline(TIME_BUDGET_S)
        for penalty, step, iterations in schedule:
            for _ in range(iterations):
                if expired(stop_at):
                    break
                _ascend(xs, ys, rs, penalty, step)
        return [(x, y) for x, y in zip(xs, ys)], rs


    def _ascend(xs, ys, rs, penalty, step):
        n = len(xs)
        gx = [0.0] * n
        gy = [0.0] * n
        gr = [1.0] * n
        for i in range(n):
            x, y, r = xs[i], ys[i], rs[i]
            for value, dx, dy in (
                (x, 1.0, 0.0),
                (y, 0.0, 1.0),
                (1.0 - x, -1.0, 0.0),
                (1.0 - y, 0.0, -1.0),
            ):
                excess = r - value
                if excess > 0.0:
                    gr[i] -= 2.0 * penalty * excess
                    gx[i] += 2.0 * penalty * excess * dx
                    gy[i] += 2.0 * penalty * excess * dy
        for i in range(n):
            for j in range(i + 1, n):
                dx = xs[i] - xs[j]
                dy = ys[i] - ys[j]
                distance = math.hypot(dx, dy) or 1e-9
                excess = rs[i] + rs[j] - distance
                if excess > 0.0:
                    gr[i] -= 2.0 * penalty * excess
                    gr[j] -= 2.0 * penalty * excess
                    ux, uy = dx / distance, dy / distance
                    gx[i] += 2.0 * penalty * excess * ux
                    gy[i] += 2.0 * penalty * excess * uy
                    gx[j] -= 2.0 * penalty * excess * ux
                    gy[j] -= 2.0 * penalty * excess * uy
        for i in range(n):
            xs[i] = min(1.0, max(0.0, xs[i] + step * gx[i]))
            ys[i] = min(1.0, max(0.0, ys[i] + step * gy[i]))
            rs[i] = max(1e-4, rs[i] + step * gr[i])
    ```

