# 1. The first improvement: stop treating the packing as a fixed arrangement
#    and let the centres move under a penalty that is raised in stages.
- |
  ```python
  def construct_packing():
      """Penalty relaxation from the grid, on a four-stage schedule.

      The uniform grid is a local optimum only because the centres are frozen.
      Let them move: maximise the sum of radii under a quadratic penalty on
      wall and pair violations, and raise the penalty in stages so that early
      iterations can pass through infeasible arrangements and late ones settle
      into a legal one.
      """
      schedule = (
          (10.0, 0.02, 300),
          (50.0, 0.01, 300),
          (200.0, 0.004, 300),
          (1000.0, 0.001, 300),
      )
      return _relax(schedule)


  def _grid_start():
      xs, ys, rs = [], [], []
      for i in range(5):
          for j in range(5):
              xs.append(0.1 + 0.2 * i)
              ys.append(0.1 + 0.2 * j)
              rs.append(0.1)
      xs.append(0.2)
      ys.append(0.2)
      rs.append(0.0414)
      return xs, ys, rs


  def _relax(schedule):
      xs, ys, rs = _grid_start()
      stop_at = deadline(TIME_BUDGET_S)
      for penalty, step, iterations in schedule:
          for _ in range(iterations):
              if expired(stop_at):
                  break
              _ascend(xs, ys, rs, penalty, step)
      return [(x, y) for x, y in zip(xs, ys)], rs


  def _ascend(xs, ys, rs, penalty, step):
      n = len(xs)
      gx = [0.0] * n
      gy = [0.0] * n
      gr = [1.0] * n
      for i in range(n):
          x, y, r = xs[i], ys[i], rs[i]
          for value, dx, dy in (
              (x, 1.0, 0.0),
              (y, 0.0, 1.0),
              (1.0 - x, -1.0, 0.0),
              (1.0 - y, 0.0, -1.0),
          ):
              excess = r - value
              if excess > 0.0:
                  gr[i] -= 2.0 * penalty * excess
                  gx[i] += 2.0 * penalty * excess * dx
                  gy[i] += 2.0 * penalty * excess * dy
      for i in range(n):
          for j in range(i + 1, n):
              dx = xs[i] - xs[j]
              dy = ys[i] - ys[j]
              distance = math.hypot(dx, dy) or 1e-9
              excess = rs[i] + rs[j] - distance
              if excess > 0.0:
                  gr[i] -= 2.0 * penalty * excess
                  gr[j] -= 2.0 * penalty * excess
                  ux, uy = dx / distance, dy / distance
                  gx[i] += 2.0 * penalty * excess * ux
                  gy[i] += 2.0 * penalty * excess * uy
                  gx[j] -= 2.0 * penalty * excess * ux
                  gy[j] -= 2.0 * penalty * excess * uy
      for i in range(n):
          xs[i] = min(1.0, max(0.0, xs[i] + step * gx[i]))
          ys[i] = min(1.0, max(0.0, ys[i] + step * gy[i]))
          rs[i] = max(1e-4, rs[i] + step * gr[i])
  ```

# 2. A regression: 26 equal circles in rows of 6, 5, 6, 5 and 4. Legal, and
#    clearly worse than the seed -- six circles across forces a radius of
#    1/12, and 26 x 1/12 is 2.167. The archive needs a losing lineage too.
- |
  ```python
  def construct_packing():
      """Rows of 6, 5, 6, 5 and 4 equal circles, sized by the widest row."""
      counts = (6, 5, 6, 5, 4)
      radius = 1.0 / 12.0
      span = 1.0 - 2.0 * radius
      centers = []
      radii = []
      for row, count in enumerate(counts):
          y = radius + row * span / (len(counts) - 1)
          for column in range(count):
              x = radius + column * span / (max(counts) - 1)
              centers.append((x, y))
              radii.append(radius)
      return centers, radii
  ```

