# 11. A SECOND improvement, structurally new rather than retuned: two bonus
#     terms instead of one. It arrives late, after the breadth has grown on a
#     stagnant stretch, so the run's log shows `adaptive_children` giving a
#     child back once the search is climbing again.
- |
  ```python
  def priority(item, bins):
      """Two bonuses, not one: a usable residual and an almost-exact fit.

      The single-bonus rule rewards a residual another item can still use. It
      says nothing about residuals near zero, which are the ones that close a
      bin for good. A second, smaller bump near zero pays for those.
      """
      scores = []
      for b in bins:
          residual = b - item
          usable = 30.0 * math.exp(-((residual - 35.0) ** 2) / 128.0)
          snug = 5.0 * math.exp(-((residual - 5.0) ** 2) / 32.0)
          scores.append(-residual + usable + snug)
      return scores
  ```
