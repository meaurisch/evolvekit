name: test
on: [push, pull_request]
jobs:
  test:
    # Windows too: evaluate/process.py kills evaluator trees with Windows-only
    # code (a Job Object, parent-link watching) that Linux never runs.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.12"}
      # No fallback: a dev install that fails must fail here, not later as a
      # confusing "No module named ruff".
      - run: pip install -e ".[dev]"
      - run: python tasks.py check  # lint, then every test
