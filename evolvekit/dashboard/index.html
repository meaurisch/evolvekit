<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>evolvekit run</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232a78d6'/%3E%3Cpath d='M7 22l6-7 4 4 8-10' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
/* ------------------------------------------------------------------ tokens
   One place for every colour. Light and dark are both *chosen*, not flipped:
   the dark column is the same hues stepped for a dark surface. Status colours
   are reserved for state and always travel with an icon and a word. */
:root {
  color-scheme: light;
  --page: #f6f6f3; --surface: #ffffff; --surface-2: #fafaf8; --sunken: #f1f0ec;
  --ink: #0b0b0b; --ink-2: #52514e; --ink-3: #85837c;
  --hair: rgba(11,11,11,.10); --hair-strong: rgba(11,11,11,.18);
  --grid: #e7e6df; --axis: #c3c2b7;
  --accent: #2a78d6; --accent-wash: rgba(42,120,214,.12); --accent-ink: #1c5cab;
  --worse: #e34948; --worse-wash: rgba(227,73,72,.12);
  --neutral: #d9d8d1;
  --good: #0ca30c; --good-ink: #006300; --warning: #c98500; --warning-fill: #fab219;
  --serious: #d2622f; --critical: #d03b3b;
  --seq-1: #cde2fb; --seq-2: #9ec5f4; --seq-3: #6da7ec; --seq-4: #3987e5; --seq-5: #1c5cab;
  --add-bg: rgba(12,163,12,.10); --del-bg: rgba(208,59,59,.10);
  --shadow: 0 1px 2px rgba(11,11,11,.04), 0 8px 24px -12px rgba(11,11,11,.12);
  --radius: 12px;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --surface-2: #201f1e; --sunken: #141413;
  --ink: #ffffff; --ink-2: #c3c2b7; --ink-3: #8f8d86;
  --hair: rgba(255,255,255,.10); --hair-strong: rgba(255,255,255,.20);
  --grid: #2a2a28; --axis: #3d3d3a;
  --accent: #4a93ea; --accent-wash: rgba(74,147,234,.16); --accent-ink: #86b6ef;
  --worse: #e66767; --worse-wash: rgba(230,103,103,.16);
  --neutral: #383835;
  --good: #25b825; --good-ink: #4fd14f; --warning: #fab219; --warning-fill: #fab219;
  --serious: #ec835a; --critical: #ef6a6a;
  --seq-1: #12325a; --seq-2: #184f95; --seq-3: #256abf; --seq-4: #3987e5; --seq-5: #86b6ef;
  --add-bg: rgba(37,184,37,.16); --del-bg: rgba(239,106,106,.16);
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 32px -16px rgba(0,0,0,.7);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --surface-2: #201f1e; --sunken: #141413;
    --ink: #ffffff; --ink-2: #c3c2b7; --ink-3: #8f8d86;
    --hair: rgba(255,255,255,.10); --hair-strong: rgba(255,255,255,.20);
    --grid: #2a2a28; --axis: #3d3d3a;
    --accent: #4a93ea; --accent-wash: rgba(74,147,234,.16); --accent-ink: #86b6ef;
    --worse: #e66767; --worse-wash: rgba(230,103,103,.16);
    --neutral: #383835;
    --good: #25b825; --good-ink: #4fd14f; --warning: #fab219; --warning-fill: #fab219;
    --serious: #ec835a; --critical: #ef6a6a;
    --seq-1: #12325a; --seq-2: #184f95; --seq-3: #256abf; --seq-4: #3987e5; --seq-5: #86b6ef;
    --add-bg: rgba(37,184,37,.16); --del-bg: rgba(239,106,106,.16);
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 32px -16px rgba(0,0,0,.7);
  }
}

/* -------------------------------------------------------------------- base */
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--page); color: var(--ink);
  font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; }
code, pre, .mono { font-family: ui-monospace, "Cascadia Mono", "SF Mono", Consolas, monospace; }
a { color: var(--accent-ink); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ------------------------------------------------------------------ header */
.top {
  position: sticky; top: 0; z-index: 20;
  background: color-mix(in srgb, var(--page) 86%, transparent);
  backdrop-filter: saturate(1.4) blur(10px);
  border-bottom: 1px solid var(--hair);
}
.top-in {
  max-width: 1440px; margin: 0 auto; padding: 12px 24px;
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
}
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand svg { flex: none; }
.brand b { font-weight: 650; letter-spacing: -.01em; }
.run-path {
  color: var(--ink-3); font-size: 12px; max-width: 46ch;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left;
}
.pill {
  display: inline-flex; align-items: center; gap: 8px; padding: 4px 12px 4px 10px;
  border-radius: 999px; font-weight: 650; font-size: 12px; letter-spacing: .04em;
  border: 1px solid var(--hair-strong); background: var(--surface); white-space: nowrap;
}
.pill .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); flex: none; }
.pill[data-state="running"] { color: var(--good-ink); border-color: color-mix(in srgb, var(--good) 45%, transparent); }
.pill[data-state="running"] .dot { background: var(--good); animation: pulse 1.8s ease-out infinite; }
.pill[data-state="stalled"] { color: var(--warning); border-color: color-mix(in srgb, var(--warning-fill) 60%, transparent); }
.pill[data-state="stalled"] .dot { background: var(--warning-fill); }
.pill[data-state="crashed"], .pill[data-state="missing"] { color: var(--critical); border-color: color-mix(in srgb, var(--critical) 50%, transparent); }
.pill[data-state="crashed"] .dot, .pill[data-state="missing"] .dot { background: var(--critical); }
.pill[data-state="interrupted"] { color: var(--serious); border-color: color-mix(in srgb, var(--serious) 50%, transparent); }
.pill[data-state="interrupted"] .dot { background: var(--serious); }
.pill[data-state="finished"] { color: var(--accent-ink); border-color: color-mix(in srgb, var(--accent) 45%, transparent); }
.pill[data-state="finished"] .dot { background: var(--accent); }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--good) 60%, transparent); } 100% { box-shadow: 0 0 0 9px transparent; } }
@media (prefers-reduced-motion: reduce) { .pill .dot { animation: none !important; } }
.detail { color: var(--ink-2); flex: 1 1 320px; min-width: 0; }
.top-tools { margin-left: auto; display: flex; align-items: center; gap: 10px; color: var(--ink-3); font-size: 12px; }
.ghost {
  border: 1px solid var(--hair-strong); background: var(--surface); border-radius: 8px;
  padding: 5px 10px; cursor: pointer; color: var(--ink-2);
}
.ghost:hover { color: var(--ink); border-color: var(--ink-3); }
.offline { color: var(--critical); font-weight: 600; }
.nav { max-width: 1440px; margin: 0 auto; padding: 0 24px; display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.nav::-webkit-scrollbar { display: none; }
.nav a {
  color: var(--ink-2); text-decoration: none; font-size: 13px; padding: 7px 10px 9px; white-space: nowrap;
  border-bottom: 2px solid transparent; display: inline-flex; align-items: center; gap: 6px;
}
.nav a:hover { color: var(--ink); border-bottom-color: var(--hair-strong); }
.nav .count { font-size: 11px; font-weight: 650; border-radius: 999px; padding: 0 6px; background: var(--sunken); color: var(--ink-2); font-variant-numeric: tabular-nums; }
.nav .count.bad { background: color-mix(in srgb, var(--critical) 14%, transparent); color: var(--critical); }
section[id] { scroll-margin-top: 108px; }

/* ------------------------------------------------------------------ layout */
main { max-width: 1440px; margin: 0 auto; padding: 20px 24px 64px; display: grid; gap: 20px; }
.grid2 { display: grid; gap: 20px; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
@media (max-width: 960px) { .grid2 { grid-template-columns: minmax(0, 1fr); } }
.card {
  background: var(--surface); border: 1px solid var(--hair); border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 20px; min-width: 0;
}
.card-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.card-head h2 { margin: 0; font-size: 15px; font-weight: 650; letter-spacing: -.01em; }
.card-head .q { color: var(--ink-3); font-size: 13px; }
.card-head .tools { margin-left: auto; display: flex; gap: 6px; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--hair-strong); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 4px 10px; cursor: pointer; color: var(--ink-2); font-size: 12px; }
.seg button + button { border-left: 1px solid var(--hair-strong); }
.seg button[aria-pressed="true"] { background: var(--sunken); color: var(--ink); font-weight: 600; }
.note { color: var(--ink-3); font-size: 12.5px; }
.empty { color: var(--ink-3); padding: 18px 0; max-width: 70ch; }

/* ------------------------------------------------------------------- tiles */
.tiles { display: grid; gap: 12px; grid-template-columns: repeat(6, minmax(0, 1fr)); }
@media (max-width: 1180px) { .tiles { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 560px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.tile { background: var(--surface-2); border: 1px solid var(--hair); border-radius: 10px; padding: 12px 14px; min-width: 0; }
.tile .k { color: var(--ink-3); font-size: 12px; }
.tile .v { font-size: 24px; font-weight: 650; letter-spacing: -.02em; line-height: 1.2; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile .v small { font-size: 13px; font-weight: 500; color: var(--ink-3); letter-spacing: 0; }
.tile .s { color: var(--ink-2); font-size: 12px; margin-top: 2px; min-height: 18px; }
.tile .s .bad { color: var(--critical); font-weight: 600; }
.tile .s .warn { color: var(--warning); font-weight: 600; }
.meter { height: 4px; border-radius: 4px; background: var(--accent-wash); margin-top: 8px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
.meter.warn { background: color-mix(in srgb, var(--warning-fill) 20%, transparent); }
.meter.warn i { background: var(--warning-fill); }
.meter.crit { background: color-mix(in srgb, var(--critical) 18%, transparent); }
.meter.crit i { background: var(--critical); }

/* One cell per generation, from the seed to the last planned one: the run's
   rhythm at a glance -- how far along, which generations moved the best, where
   the failures were. */
.ribbon-wrap { margin-top: 14px; }
.ribbon { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 3px; }
.gen {
  height: 30px; border-radius: 5px; background: var(--neutral); position: relative; min-width: 0;
  display: grid; place-items: center; font-size: 11px; color: var(--ink-2); font-variant-numeric: tabular-nums;
}
.gen.planned { background: transparent; box-shadow: inset 0 0 0 1px var(--hair-strong); color: var(--ink-3); }
.gen.improved { background: var(--accent); color: #fff; font-weight: 650; }
.gen.current { background: var(--accent-wash); box-shadow: inset 0 0 0 1.5px var(--accent); color: var(--accent-ink); font-weight: 650; animation: breathe 1.8s ease-in-out infinite; }
@keyframes breathe { 50% { background: transparent; } }
@media (prefers-reduced-motion: reduce) { .gen.current { animation: none; } }
.ribbon.halted .gen.current { animation: none; background: transparent; color: var(--critical); box-shadow: inset 0 0 0 1.5px var(--critical); }
.gen .x { position: absolute; top: -5px; right: -3px; min-width: 14px; height: 14px; padding: 0 3px; border-radius: 7px; background: var(--critical); color: #fff; font-size: 9.5px; font-weight: 700; display: grid; place-items: center; box-shadow: 0 0 0 2px var(--surface); }
.ribbon.dense .gen { font-size: 0; height: 22px; } .ribbon.dense .gen .x { display: none; } .ribbon.dense .gen.hasfail::after { content: ""; position: absolute; left: 0; right: 0; bottom: -4px; height: 2px; border-radius: 2px; background: var(--critical); }
.strip { display: grid; gap: 12px; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); margin-top: 14px; }
@media (max-width: 960px) { .strip { grid-template-columns: minmax(0, 1fr); } }
.sub h3 { margin: 0 0 8px; font-size: 12px; font-weight: 600; color: var(--ink-3); text-transform: uppercase; letter-spacing: .06em; }
.flight { display: grid; gap: 8px; }
.flight-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; font-size: 13px; }
.flight-row .who { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.flight-row .who b { font-weight: 600; }
.flight-row .t { color: var(--ink-2); font-variant-numeric: tabular-nums; }
.flight-row .meter { grid-column: 1 / -1; margin-top: 0; }
.limits { display: grid; gap: 8px; }
.limit { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; font-size: 13px; }
.limit .n { color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.limit .u { color: var(--ink-2); font-variant-numeric: tabular-nums; }
.limit .meter { grid-column: 1 / -1; margin-top: 0; }

/* ---------------------------------------------------------------- progress */
.progress { display: grid; grid-template-columns: minmax(220px, 300px) minmax(0, 1fr); gap: 24px; align-items: start; }
@media (max-width: 960px) { .progress { grid-template-columns: minmax(0, 1fr); } }
.hero .k { color: var(--ink-3); font-size: 13px; }
.hero .big { font-size: 56px; font-weight: 680; letter-spacing: -.035em; line-height: 1.05; margin: 4px 0 8px; }
.hero .big.up { color: var(--good-ink); }
.hero .big.down { color: var(--critical); }
.badge { display: inline-flex; align-items: center; gap: 6px; border-radius: 6px; padding: 2px 8px; font-size: 12px; font-weight: 600; border: 1px solid var(--hair-strong); }
.badge[data-v="clear"] { color: var(--good-ink); border-color: color-mix(in srgb, var(--good) 45%, transparent); background: color-mix(in srgb, var(--good) 8%, transparent); }
.badge[data-v="within noise"] { color: var(--warning); border-color: color-mix(in srgb, var(--warning-fill) 55%, transparent); background: color-mix(in srgb, var(--warning-fill) 10%, transparent); }
.badge[data-v="unknown"], .badge[data-v="none"] { color: var(--ink-2); background: var(--sunken); }
.hero .why { color: var(--ink-2); font-size: 12.5px; margin-top: 10px; max-width: 46ch; }
.pair { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; margin-top: 16px; font-size: 13px; }
.pair dt { color: var(--ink-3); }
.pair dd { margin: 0; font-variant-numeric: tabular-nums; }
.pair dd .pm { color: var(--ink-3); }
.chart { position: relative; min-width: 0; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart text { fill: var(--ink-3); font-size: 11px; }
.chart .lbl { fill: var(--ink-2); }
.chart .strong { fill: var(--ink); font-weight: 600; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; color: var(--ink-2); font-size: 12px; margin-top: 8px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { display: inline-block; }
.hit { cursor: pointer; }

/* ------------------------------------------------------------------ tables */
.scroll { overflow-x: auto; margin: 0 -20px; padding: 0 20px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th { text-align: left; color: var(--ink-3); font-weight: 600; font-size: 12px; padding: 6px 10px; border-bottom: 1px solid var(--hair-strong); white-space: nowrap; position: sticky; top: 0; background: var(--surface); }
th button { border: 0; background: none; padding: 0; cursor: pointer; color: inherit; font-weight: inherit; }
th button:hover { color: var(--ink); }
td { padding: 7px 10px; border-bottom: 1px solid var(--hair); vertical-align: top; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
tbody tr.click { cursor: pointer; }
tbody tr.click:hover { background: var(--surface-2); }
tbody tr.best td { background: var(--accent-wash); }
.id { font-family: ui-monospace, Consolas, monospace; font-size: 12px; white-space: nowrap; }
.chip { display: inline-block; border-radius: 5px; padding: 1px 7px; font-size: 11.5px; font-weight: 600; border: 1px solid var(--hair-strong); color: var(--ink-2); white-space: nowrap; }
.chip.ok { color: var(--good-ink); border-color: color-mix(in srgb, var(--good) 40%, transparent); }
.chip.bad { color: var(--critical); border-color: color-mix(in srgb, var(--critical) 45%, transparent); }
.chip.dim { color: var(--ink-3); }
.chip.star { color: var(--accent-ink); border-color: color-mix(in srgb, var(--accent) 45%, transparent); background: var(--accent-wash); }
.up-t { color: var(--good-ink); } .down-t { color: var(--critical); }
.clip { max-width: 46ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* -------------------------------------------------------- best + parameters */
.track { position: relative; height: 14px; min-width: 120px; }
.track::before { content: ""; position: absolute; left: 0; right: 0; top: 6px; height: 2px; background: var(--grid); border-radius: 2px; }
.track .def { position: absolute; top: 2px; width: 2px; height: 10px; background: var(--ink-3); transform: translateX(-1px); }
.track .val { position: absolute; top: 2px; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); border: 2px solid var(--surface); transform: translateX(-5px); box-sizing: content-box; margin-top: -2px; }
.track .val.same { background: var(--ink-3); }
pre.code, pre.diff, pre.log {
  margin: 0; padding: 12px 14px; background: var(--sunken); border: 1px solid var(--hair);
  border-radius: 10px; font-size: 12px; line-height: 1.55; overflow: auto; max-height: 420px; tab-size: 4;
}
pre.diff span { display: block; padding: 0 6px; margin: 0 -6px; border-radius: 3px; }
pre.diff .a { background: var(--add-bg); } pre.diff .d { background: var(--del-bg); }
pre.diff .h { color: var(--ink-3); }
.imp { display: grid; gap: 2px; }
.imp-row {
  display: grid; grid-template-columns: minmax(90px, 1.2fr) minmax(80px, 2fr) 64px 40px; gap: 12px;
  align-items: center; padding: 6px 8px; border-radius: 8px; border: 1px solid transparent;
  background: none; text-align: left; cursor: pointer; width: 100%; font-size: 13px;
}
.imp-row:hover { background: var(--surface-2); }
.imp-row[aria-pressed="true"] { background: var(--accent-wash); border-color: color-mix(in srgb, var(--accent) 35%, transparent); }
.imp-row .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: ui-monospace, Consolas, monospace; font-size: 12px; }
.imp-row .bar { height: 10px; background: var(--sunken); border-radius: 0 4px 4px 0; overflow: hidden; }
.imp-row .bar i { display: block; height: 100%; background: var(--accent); border-radius: 0 4px 4px 0; }
.imp-row .r, .imp-row .n { text-align: right; font-variant-numeric: tabular-nums; color: var(--ink-2); }
.cover { display: grid; grid-template-columns: repeat(10, 1fr); gap: 2px; margin-top: 4px; }
.cover i { height: 8px; border-radius: 2px; background: var(--sunken); }

/* --------------------------------------------------------------- instances */
.inst { display: grid; gap: 6px; }
.inst-row { display: grid; grid-template-columns: minmax(70px, 140px) minmax(0, 1fr) 72px; gap: 12px; align-items: center; font-size: 13px; }
.inst-row .nm { color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.inst-row .v { text-align: right; font-variant-numeric: tabular-nums; }
.div { position: relative; height: 14px; }
.div::before { content: ""; position: absolute; left: var(--zero, 50%); top: -3px; bottom: -3px; width: 1px; background: var(--axis); }
.div i { position: absolute; top: 2px; height: 10px; }
.div i.w { left: var(--zero, 50%); background: var(--accent); border-radius: 0 4px 4px 0; }
.div i.l { right: calc(100% - var(--zero, 50%)); background: var(--worse); border-radius: 4px 0 0 4px; }
.sum { display: flex; gap: 18px; flex-wrap: wrap; font-size: 13px; color: var(--ink-2); margin-bottom: 12px; }
.sum b { color: var(--ink); font-weight: 650; font-size: 15px; }

/* ----------------------------------------------------------------- archive */
.cells { display: grid; gap: 3px; }
.cell { aspect-ratio: 1.6; border-radius: 5px; background: var(--sunken); display: grid; place-items: center; font-size: 11px; color: var(--ink-3); min-width: 0; }
.cell[data-l] { color: var(--ink); cursor: pointer; }
.cell[data-l="1"] { background: var(--seq-1); } .cell[data-l="2"] { background: var(--seq-2); }
.cell[data-l="3"] { background: var(--seq-3); color: #0b0b0b; } .cell[data-l="4"] { background: var(--seq-4); color: #fff; }
.cell[data-l="5"] { background: var(--seq-5); color: #fff; }
.cell[data-l="1"], .cell[data-l="2"] { color: #0b0b0b; }
:root[data-theme="dark"] .cell[data-l="1"], :root[data-theme="dark"] .cell[data-l="2"], :root[data-theme="dark"] .cell[data-l="3"] { color: #fff; }
:root[data-theme="dark"] .cell[data-l="5"] { color: #0b0b0b; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .cell[data-l="1"], :root:not([data-theme="light"]) .cell[data-l="2"], :root:not([data-theme="light"]) .cell[data-l="3"] { color: #fff; } :root:not([data-theme="light"]) .cell[data-l="5"] { color: #0b0b0b; } }
pre.log { max-height: 300px; white-space: pre; }
.drawer pre.log { white-space: pre-wrap; word-break: break-word; }

/* ------------------------------------------------------------------ drawer */

<body>
<header class="top"><div class="top-in">
  <div class="brand">
    <svg width="26" height="26" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="var(--accent)"/><path d="M7 22l6-7 4 4 8-10" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <div style="min-width:0"><b>evolvekit</b><div class="run-path" id="run-path" title=""></div></div>
  </div>
  <span class="pill" id="pill" data-state="unknown"><span class="dot"></span><span id="pill-text">LOADING</span></span>

</div><nav class="nav" id="nav" aria-label="Sections"></nav></header>

<main id="main" aria-live="off">

  <section class="card" id="progress" aria-labelledby="h-progress"></section>
  <div class="grid2">

  </div>
  <section class="card" id="instances" aria-labelledby="h-instances"></section>

  <section class="card" id="candidates" aria-labelledby="h-candidates"></section>
  <div class="grid2">

    <section class="card" id="log" aria-labelledby="h-log"></section>
  </div>
</main>
<footer id="footer"></footer>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title" hidden>
  <div class="drawer-head"><h2 id="drawer-title"></h2><span id="drawer-chips"></span>
    <button class="ghost" id="drawer-close" type="button" style="margin-left:auto">Close</button></div>
  <div class="drawer-body" id="drawer-body"></div>
</aside>
<div id="tip" role="tooltip"></div>

<script>
"use strict";
/* Everything on this page is drawn from ONE document: GET api/status, which is
   what `evolvekit status --json` prints. The exported, offline form of this
   page carries that document in EMBEDDED instead of fetching it. */
const EMBEDDED = /*__EVOLVEKIT_EMBEDDED__*/null;

const ui = { doc: null, param: null, bestTab: "parameters", filter: "all", sort: { key: "generation", dir: 1 },
             chartTable: false, instTable: false, lastOk: 0, signatures: {}, drawer: null };

/* ------------------------------------------------------------- DOM helper

const s = (tag, attrs, ...kids) => h(tag, { ...attrs, __svg: true }, ...kids);
const $ = (id) => document.getElementById(id);

/* -------------------------------------------------------------- formatting */
const isNum = (v) => typeof v === "number" && Number.isFinite(v);

function cardHead(id, title, question, tools) {
  return h("div", { class: "card-head" }, h("h2", { id: "h-" + id }, title), h("span", { class: "q" }, question),
           tools ? h("div", { class: "tools" }, tools) : null);
}
function seg(options, current, onPick) {
  return h("div", { class: "seg", role: "group" }, options.map(([value, label]) =>
    h("button", { type: "button", "aria-pressed": String(value === current), onclick: () => onPick(value) }, label)));
}
function replace(id, signature, build) {
  const key = JSON.stringify(signature);

  $(id).replaceChildren(...[build()].flat());

/* ----------------------------------------------------------------- tooltip */
const tip = $("tip");
function showTip(event, ...kids) {
  tip.replaceChildren(...kids); tip.classList.add("on");

  if (y + r.height > innerHeight - 8) y = event.clientY - r.height - pad;

/* ------------------------------------------------------------------ header */
const STATE_WORD = { running: "RUNNING", stalled: "STALLED", finished: "FINISHED", interrupted: "INTERRUPTED",
                     crashed: "CRASHED", empty: "EMPTY", missing: "MISSING", unknown: "UNKNOWN" };
function renderHeader(doc) {
  const health = doc.health || {};
  $("run-path").textContent = doc.run_dir || ""; $("run-path").title = doc.run_dir || "";
  $("pill").dataset.state = health.state || "unknown";
  $("pill-text").textContent = STATE_WORD[health.state] || "UNKNOWN";
  $("detail").textContent = health.detail || "";
  document.title = (STATE_WORD[health.state] || "run") + " · " + (pct((doc.progress || {}).improvement?.pct) || "") + " · evolvekit";
}
function renderNav(doc) {
  const failures = (doc.failures || []).length, unfinished = (doc.candidates || []).filter((c) => !c.rejected && !c.competes).length;
  const link = (id, label, count, bad) => h("a", { href: "#" + id }, label, count != null ? h("span", { class: "count" + (bad && count ? " bad" : "") }, count) : null);
  $("nav").replaceChildren(link("health", "Health"), link("progress", "Progress"), link("best", "Best configuration"), link("parameters", "Parameters"),
    link("instances", "Per instance"), link("failures", "What went wrong", failures, true), link("candidates", "Candidates", (doc.candidates || []).length), link("archive", "Archive"), link("log", "Console"));
  void unfinished;
}
function renderClock() {
  const node = $("updated");
  if (EMBEDDED) { node.textContent = "snapshot of " + when(ui.doc?.generated_at); return; }
  const age = (Date.now() - ui.lastOk) / 1000;
  node.className = age > 8 ? "offline" : "";
  node.textContent = !ui.lastOk ? "connecting…" : age > 8 ? "server unreachable · last update " + dur(age) + " ago" : "live · " + clock(ui.doc.generated_at);
}

/* ------------------------------------------------------------------ health */
function ratioClass(r) { return r >= 1 ? "crit" : r >= 0.8 ? "warn" : ""; }
function meter(ratio, cls) { return h("div", { class: "meter " + (cls || "") }, h("i", { style: { width: Math.max(0, Math.min(1, ratio || 0)) * 100 + "%" } })); }
function renderHealth(doc) {
  const he = doc.health || {}, gen = he.generation || {}, ev = he.evaluations || {}, eta = he.eta || {}, sp = doc.spend || {};
  const planned = gen.last_planned, done = gen.last_finished ?? 0;
  const total = (ev.done || 0) + (ev.failed || 0), failRate = total ? (ev.failed || 0) / total : 0;
  const free = !(sp.usd > 0);
  const tiles = [
    h("div", { class: "tile" }, h("div", { class: "k" }, "Generation"),
      h("div", { class: "v" }, gen.current ?? "–", planned != null ? h("small", null, " of " + planned) : null),
      h("div", { class: "s" }, (gen.last_finished ?? 0) + " finished" + (he.sessions > 1 ? " · " + he.sessions + " sessions" : "")),
      planned ? meter(done / planned) : null),
    h("div", { class: "tile" }, h("div", { class: "k" }, "Evaluations done"),
      h("div", { class: "v" }, num(ev.done ?? 0)),
      h("div", { class: "s" }, (ev.in_flight || 0) + " in flight")),
    h("div", { class: "tile" }, h("div", { class: "k" }, "Failed evaluations"),
      h("div", { class: "v" }, num(ev.failed ?? 0), total ? h("small", null, "  " + (100 * failRate).toFixed(0) + " %") : null),
      h("div", { class: "s" }, ev.abandoned ? h("span", { class: "bad" }, "✕ " + ev.abandoned + " abandoned by a dead session") :
        !ev.failed ? "✓ none" : h("a", { href: "#failures", class: failRate >= 0.3 ? "bad" : failRate >= 0.1 ? "warn" : "" }, (failRate >= 0.1 ? "⚠ " : "") + "see what went wrong"))),
    h("div", { class: "tile" }, h("div", { class: "k" }, "Elapsed"),
      h("div", { class: "v" }, dur(he.elapsed_s)), h("div", { class: "s" }, he.started_at ? "since " + when(he.started_at) : "")),
    h("div", { class: "tile", title: eta.basis || "" }, h("div", { class: "k" }, "Time remaining"),
      h("div", { class: "v" }, isNum(eta.seconds) ? dur(eta.seconds) : "–"),
      h("div", { class: "s" }, eta.at ? "around " + when(eta.at) : (eta.basis || "").split(";")[0].slice(0, 60))),
    free  // a zero-LLM run costs compute, not dollars: lead with the one that is being spent
      ? h("div", { class: "tile" }, h("div", { class: "k" }, "Evaluator time"), h("div", { class: "v" }, dur(sp.evaluator_s)), h("div", { class: "s" }, "no LLM spend"))
      : h("div", { class: "tile" }, h("div", { class: "k" }, "Spend"), h("div", { class: "v" }, "$" + num(sp.usd, 4)),
          h("div", { class: "s" }, (sp.calls || 0) + " LLM calls · " + dur(sp.evaluator_s) + " evaluating")),
  ];
  const gens = (doc.progress || {}).generations || [];
  const ribbon = gens.length > 1 ? h("div", { class: "ribbon-wrap" }, h("div", { class: "sub" }, h("h3", null, "Generations"),
    h("div", { class: "ribbon" + (gens.length > 40 ? " dense" : "") + (["running", "stalled"].includes(he.state) ? "" : " halted"), role: "img", "aria-label": `${gens.filter((g) => g.state === "done").length} of ${gens.length} generations finished, ${gens.filter((g) => g.improved).length} improved the best` },
      gens.map((g) => { const node = h("div", { class: "gen " + g.state + (g.improved ? " improved" : "") + (g.failed ? " hasfail" : "") }, g.generation, g.failed ? h("span", { class: "x" }, g.failed) : null);
        node.addEventListener("pointermove", (e) => showTip(e, h("b", null, (g.generation === 0 ? "generation 0 — the baseline" : "generation " + g.generation) + (g.improved ? " · new best" : "")),
          h("div", null, g.state === "planned" ? "not started" : g.state === "current" ? (["running", "stalled"].includes(he.state) ? "in progress" : "unfinished: the run stopped here") : (isNum(g.duration_s) ? dur(g.duration_s) : "") + (g.children ? " · " + g.children + " children" : "")),
          g.state !== "planned" && isNum(g.best_objective) ? h("div", { class: "m" }, "best so far " + num(g.best_objective)) : null, g.failed ? h("div", { class: "m" }, g.failed + " failed evaluation(s)") : null));
        node.addEventListener("pointerleave", hideTip); return node; })),
    h("div", { class: "legend" }, h("span", null, h("i", { style: { width: "12px", height: "10px", background: "var(--accent)", borderRadius: "3px" } }), "moved the best"),
      h("span", null, h("i", { style: { width: "12px", height: "10px", background: "var(--neutral)", borderRadius: "3px" } }), "finished, no improvement"),
      ["running", "stalled"].includes(he.state) ? h("span", null, h("i", { style: { width: "12px", height: "10px", boxShadow: "inset 0 0 0 1.5px var(--accent)", borderRadius: "3px" } }), "in progress")
        : gens.some((g) => g.state === "current") ? h("span", null, h("i", { style: { width: "12px", height: "10px", boxShadow: "inset 0 0 0 1.5px var(--critical)", borderRadius: "3px" } }), "where the run stopped") : null,
      h("span", null, h("i", { style: { width: "12px", height: "10px", boxShadow: "inset 0 0 0 1px var(--hair-strong)", borderRadius: "3px" } }), "planned"),
      gens.some((g) => g.failed) ? h("span", null, h("i", { style: { width: "12px", height: "12px", background: "var(--critical)", borderRadius: "6px" } }), "failed evaluations") : null))) : null;
  const flights = he.in_flight || [];
  const flight = h("div", { class: "sub" }, h("h3", null, "In flight now"),
    flights.length ? h("div", { class: "flight" }, flights.map((f) => {
      const ratio = f.timeout_s ? f.running_s / f.timeout_s : 0;
      return h("div", { class: "flight-row" },
        h("div", { class: "who" }, h("b", { class: "id" }, f.candidate_id), " · stage " + f.stage + " · seed " + f.seed + (f.private ? " · hold-out" : "")),
        h("div", { class: "t" }, dur(f.running_s) + " of " + dur(f.timeout_s)), meter(ratio, ratioClass(ratio)));
    })) : h("div", { class: "note" }, he.state === "running" ? "Between evaluations: breeding the next children." : "Nothing: the run is not running."));
  const limits = h("div", { class: "sub" }, h("h3", null, "Stopping criteria"),
    h("div", { class: "limits" }, (he.limits || []).map((l) => {
      const ratio = l.cap ? l.used / l.cap : 0;
      return h("div", { class: "limit" }, h("div", { class: "n" }, l.name),
        h("div", { class: "u" }, num(l.used) + " of " + num(l.cap) + (l.unit ? " " + l.unit : "")),
        meter(ratio, l.name === "generations" ? "" : ratioClass(ratio)));
    })));
  return [cardHead("health", "Health", "Is the run healthy, and how far along is it?"),
          h("div", { class: "tiles" }, tiles), ribbon, h("div", { class: "strip" }, flight, limits)];
}

/* ---------------------------------------------------------------- progress */
function niceTicks(lo, hi, count) {
  if (!(hi > lo)) { const p = Math.abs(lo) * 0.01 || 1; lo -= p; hi += p; }
  const raw = (hi - lo) / count, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map((m) => m * mag).find((st) => st >= raw) || raw;
  const ticks = [];
  for (let v = Math.ceil(lo / step) * step; v <= hi + step * 1e-9; v += step) ticks.push(+v.toFixed(12));
  return ticks;
}
function drawProgress(doc, width) {
  const pr = doc.progress || {}, dir = (doc.objective || {}).direction, cands = doc.candidates || [];
  const minimize = dir === "minimize";
  const pts = cands.filter((c) => c.competes && isNum(c.objective));
  if (!pts.length) return h("div", { class: "empty" }, "No fully evaluated candidate yet. The first point appears when the seed has been through the final stage.");
  const out = cands.filter((c) => !c.rejected && !c.competes);           // failed, not promoted, skipped
  const base = pr.baseline?.objective, series = (pr.series || []).filter((p) => isNum(p.best_objective));
  const W = Math.max(300, width), narrow = W < 560, H = Math.round(Math.min(380, Math.max(250, W * 0.42)));
  const m = { l: narrow ? 50 : 62, r: narrow ? 14 : 96, t: 22, b: out.length ? 62 : 38 };
  const lastGen = Math.max((doc.health?.generation?.last_planned) || 0, ...cands.map((c) => c.generation || 0), 1);

  /* The scale belongs to the question "is it beating the baseline, and by more
     than the noise?" -- so it spans baseline..best with room for the spread.
     A candidate far off on the losing side must not squash that band flat: it
     is pinned to the edge and marked as off the scale. */
  const anchors = series.map((p) => p.best_objective).concat(isNum(base) ? [base] : []);
  const sds = pts.map((p) => p.sd).filter(isNum).sort((a, b) => a - b), sdTyp = sds.length ? sds[Math.floor(sds.length / 2)] : 0;
  const aLo = Math.min(...anchors), aHi = Math.max(...anchors);
  const span = Math.max(aHi - aLo, 6 * sdTyp, Math.abs(aHi) * 0.002, 1e-9);
  let lo = aLo - span * (minimize ? 0.30 : 1.0), hi = aHi + span * (minimize ? 1.0 : 0.30);
  const inside = pts.map((p) => p.objective);
  lo = Math.max(lo, Math.min(...inside, aLo) - span * 0.15); hi = Math.min(hi, Math.max(...inside, aHi) + span * 0.15);
  const X = (g) => m.l + (W - m.l - m.r) * (g / lastGen);
  const Y = (v) => m.t + (H - m.t - m.b) * (1 - (Math.max(lo, Math.min(hi, v)) - lo) / (hi - lo));
  const svg = s("svg", { viewBox: `0 0 ${W} ${H}`, width: W, height: H, role: "img",
    "aria-label": `Best ${doc.objective?.name} per generation against the baseline` });

  for (const t of niceTicks(lo, hi, 5)) {
    svg.append(s("line", { x1: m.l, x2: W - m.r, y1: Y(t), y2: Y(t), stroke: "var(--grid)" }),
               s("text", { x: m.l - 8, y: Y(t) + 4, "text-anchor": "end" }, num(t)));
  }
  svg.append(s("text", { x: m.l, y: 11, class: "lbl" }, (doc.objective?.name || "objective") + (minimize ? "  ·  ↓ lower is better" : "  ·  ↑ higher is better")));
  const gStep = Math.max(1, Math.ceil(lastGen / Math.max(3, Math.floor((W - m.l - m.r) / 52))));

/* -------------------------------------------------------------- candidates */

    [h("span", { class: "chip bad" }, f.failure || f.kind)],

/* ------------------------------------------------------------------ render */

async function poll() {

}

/* -------------------------------------------------------------------- boot */
