<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>evolvekit</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232a78d6'/%3E%3Cpath d='M8 21l5-6 4 3 7-9' stroke='white' stroke-width='2.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
/* ------------------------------------------------------------------ tokens
   The dashboard's colours, light and dark, so the two feel like one product.
   Status colours are reserved for state and always travel with an icon and
   a word. */
:root {
  color-scheme: light;
  --page: #f6f6f3; --surface: #ffffff; --surface-2: #fafaf8; --sunken: #f1f0ec;
  --ink: #0b0b0b; --ink-2: #52514e; --ink-3: #85837c;
  --hair: rgba(11,11,11,.10); --hair-strong: rgba(11,11,11,.18);
  --grid: #e7e6df; --axis: #c3c2b7;
  --accent: #2a78d6; --accent-wash: rgba(42,120,214,.12); --accent-ink: #1c5cab; --on-accent: #ffffff;
  --worse: #e34948; --worse-wash: rgba(227,73,72,.12);
  --good: #0ca30c; --good-ink: #006300; --good-wash: rgba(12,163,12,.10);
  --warning: #9a6600; --warning-fill: #fab219; --warning-wash: rgba(250,178,25,.16);
  --critical: #d03b3b; --critical-ink: #b42525;
  --shadow: 0 1px 2px rgba(11,11,11,.04), 0 8px 24px -12px rgba(11,11,11,.12);
  --radius: 12px;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --surface-2: #201f1e; --sunken: #141413;
  --ink: #ffffff; --ink-2: #c3c2b7; --ink-3: #8f8d86;
  --hair: rgba(255,255,255,.10); --hair-strong: rgba(255,255,255,.20);
  --grid: #2a2a28; --axis: #3d3d3a;
  --accent: #4a93ea; --accent-wash: rgba(74,147,234,.16); --accent-ink: #86b6ef; --on-accent: #0b0b0b;
  --worse: #e66767; --worse-wash: rgba(230,103,103,.16);
  --good: #25b825; --good-ink: #4fd14f; --good-wash: rgba(37,184,37,.14);
  --warning: #fab219; --warning-fill: #fab219; --warning-wash: rgba(250,178,25,.14);
  --critical: #ef6a6a; --critical-ink: #ef6a6a;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 32px -16px rgba(0,0,0,.7);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --surface-2: #201f1e; --sunken: #141413;
    --ink: #ffffff; --ink-2: #c3c2b7; --ink-3: #8f8d86;
    --hair: rgba(255,255,255,.10); --hair-strong: rgba(255,255,255,.20);
    --grid: #2a2a28; --axis: #3d3d3a;
    --accent: #4a93ea; --accent-wash: rgba(74,147,234,.16); --accent-ink: #86b6ef; --on-accent: #0b0b0b;
    --worse: #e66767; --worse-wash: rgba(230,103,103,.16);
    --good: #25b825; --good-ink: #4fd14f; --good-wash: rgba(37,184,37,.14);
    --warning: #fab219; --warning-fill: #fab219; --warning-wash: rgba(250,178,25,.14);
    --critical: #ef6a6a; --critical-ink: #ef6a6a;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 32px -16px rgba(0,0,0,.7);
  }
}

/* -------------------------------------------------------------------- base */
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--page); color: var(--ink);
  font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
code, pre, .mono { font-family: ui-monospace, "Cascadia Mono", "SF Mono", Consolas, monospace; font-size: 13px; }
a { color: var(--accent-ink); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.num { font-variant-numeric: tabular-nums; }
h1, h2, h3 { letter-spacing: -.01em; line-height: 1.25; }
h1 { font-size: 26px; margin: 0 0 6px; }
h2 { font-size: 19px; margin: 28px 0 10px; }
h3 { font-size: 16px; margin: 18px 0 8px; }
p { margin: 8px 0; }
.lede { color: var(--ink-2); max-width: 70ch; }
.muted { color: var(--ink-2); }
.faint { color: var(--ink-3); font-size: 13px; }
.small { font-size: 13px; }
hr { border: 0; border-top: 1px solid var(--hair); margin: 24px 0; }

/* ------------------------------------------------------------------ header */
.top {
  position: sticky; top: 0; z-index: 30;
  background: color-mix(in srgb, var(--page) 88%, transparent);
  backdrop-filter: saturate(1.4) blur(10px);
  border-bottom: 1px solid var(--hair);
}
.top-in { max-width: 1240px; margin: 0 auto; padding: 10px 20px; display: flex; align-items: center; gap: 14px; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); font-weight: 650; }
.crumbs { display: flex; gap: 6px; align-items: center; min-width: 0; color: var(--ink-2); font-size: 14px; flex: 1; }
.crumbs a { color: var(--ink-2); text-decoration: none; }
.crumbs a:hover { color: var(--ink); text-decoration: underline; }
.crumbs span.sep { color: var(--ink-3); }
.crumbs .here { color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.top-actions { display: flex; gap: 8px; }

/* -------------------------------------------------------------------- page */
main { max-width: 1240px; margin: 0 auto; padding: 24px 20px 96px; }
.narrow { max-width: 820px; }
.card {
  background: var(--surface); border: 1px solid var(--hair); border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 18px 20px;
}
:not(.grid) > .card + .card { margin-top: 12px; }
.grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.row.between { justify-content: space-between; }
.stack > * + * { margin-top: 10px; }
.spacer { flex: 1; }

/* ----------------------------------------------------------------- buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 40px; padding: 8px 16px; border-radius: 10px; cursor: pointer;
  border: 1px solid var(--hair-strong); background: var(--surface); color: var(--ink);
  font-weight: 600; text-decoration: none; white-space: nowrap;
}
.btn:hover { background: var(--surface-2); }
.btn:disabled, .btn[aria-disabled="true"] { opacity: .5; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.danger { color: var(--critical-ink); border-color: color-mix(in srgb, var(--critical) 45%, transparent); }
.btn.quiet { border-color: transparent; background: transparent; color: var(--accent-ink); padding-inline: 8px; }
.btn.quiet:hover { background: var(--accent-wash); }
.btn.small { min-height: 32px; padding: 4px 10px; font-size: 13px; border-radius: 8px; }
.linkish { background: none; border: 0; padding: 0; color: var(--accent-ink); text-decoration: underline; cursor: pointer; }

/* ------------------------------------------------------------------ forms */
label.field { display: block; margin: 12px 0; }
label.field > span.label, .label { display: block; font-weight: 600; margin-bottom: 4px; }
.hint { display: block; color: var(--ink-2); font-size: 13px; margin-top: 4px; }
input[type=text], input[type=number], input[type=password], input[type=search], select, textarea {
  width: 100%; min-height: 40px; padding: 8px 10px; border-radius: 9px;
  border: 1px solid var(--hair-strong); background: var(--surface); color: var(--ink);
}
textarea { min-height: 90px; resize: vertical; }
input.inline, select.inline { width: auto; display: inline-block; }
input[type=number] { font-variant-numeric: tabular-nums; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: transparent; }
fieldset { border: 0; margin: 0; padding: 0; }
legend { font-weight: 600; margin-bottom: 6px; }
.seg { display: inline-flex; border: 1px solid var(--hair-strong); border-radius: 10px; overflow: hidden; flex-wrap: wrap; }
.seg label { display: flex; align-items: center; gap: 6px; padding: 6px 12px; cursor: pointer; font-size: 14px; border-right: 1px solid var(--hair); }
.seg label:last-child { border-right: 0; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg label:has(input:checked) { background: var(--accent-wash); color: var(--accent-ink); font-weight: 600; }
.seg label:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: -2px; }
.choice {
  display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: 12px; cursor: pointer;
  border: 1px solid var(--hair-strong); background: var(--surface);
}
.choice:has(input:checked) { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-wash); }
.choice input { margin-top: 4px; accent-color: var(--accent); }
.choice .t { font-weight: 650; }
.choice .d { color: var(--ink-2); font-size: 14px; }
.choices { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); }

/* ----------------------------------------------------------------- status */
.icon { width: 18px; height: 18px; flex: none; }
.status { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; font-size: 14px; }
.status.good { color: var(--good-ink); } .status.bad { color: var(--critical-ink); }
.status.warn { color: var(--warning); } .status.info { color: var(--accent-ink); } .status.none { color: var(--ink-2); }
.note { border-radius: 10px; padding: 10px 14px; background: var(--sunken); display: flex; gap: 10px; align-items: flex-start; }
.note .icon { flex: none; width: 18px; height: 18px; margin-top: 2px; }
.note.warn { background: var(--warning-wash); } .note.bad { background: var(--worse-wash); }
.note.good { background: var(--good-wash); } .note.info { background: var(--accent-wash); }
.badge { display: inline-block; font-size: 12px; font-weight: 650; padding: 1px 8px; border-radius: 999px; background: var(--sunken); color: var(--ink-2); }
.badge.accent { background: var(--accent-wash); color: var(--accent-ink); }
.badge.good { background: var(--good-wash); color: var(--good-ink); }
.spinner { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--hair-strong); border-top-color: var(--accent); animation: spin .8s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }
.pulse { width: 10px; height: 10px; border-radius: 50%; background: var(--good); animation: pulse 1.8s ease-out infinite; flex: none; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--good) 55%, transparent); } 100% { box-shadow: 0 0 0 9px transparent; } }
@media (prefers-reduced-motion: reduce) { .spinner, .pulse { animation: none; } }

/* ---------------------------------------------------------------- tables */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 9px 8px; border-bottom: 1px solid var(--hair); vertical-align: top; }
th { font-size: 12px; font-weight: 650; color: var(--ink-2); text-transform: uppercase; letter-spacing: .04em; }
td.n, th.n { text-align: right; }

/* ------------------------------------------------------------------ home */
.study-card { display: flex; flex-direction: column; gap: 8px; text-decoration: none; color: var(--ink); min-height: 132px; }
.study-card:hover { border-color: var(--accent); }
.study-card .name { font-weight: 650; font-size: 17px; }
.empty { text-align: center; padding: 40px 20px; }
.drop {
  border: 2px dashed var(--hair-strong); border-radius: 14px; padding: 26px 18px; text-align: center;
  background: var(--surface-2); color: var(--ink-2);
}
.drop.over { border-color: var(--accent); background: var(--accent-wash); color: var(--ink); }

/* ---------------------------------------------------------------- wizard */
.wizard { display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: 28px; align-items: start; }
.wizard > * { min-width: 0; }
.step { overflow-wrap: break-word; }
.wizard.with-side { grid-template-columns: 230px minmax(0, 1fr) 340px; }
.rail { position: sticky; top: 76px; }
.rail ol { list-style: none; margin: 0; padding: 0; }
.rail li a {
  display: flex; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 10px;
  color: var(--ink-2); text-decoration: none; font-size: 14px;
}
.rail li a:hover { background: var(--surface); color: var(--ink); }
.rail li a[aria-current="step"] { background: var(--accent-wash); color: var(--accent-ink); font-weight: 650; }
.rail .dot { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700; border: 1px solid var(--hair-strong); background: var(--surface); flex: none; }
.rail .dot.ok { background: var(--good-wash); border-color: transparent; color: var(--good-ink); }
.rail .dot.todo { background: var(--warning-wash); border-color: transparent; color: var(--warning); }
.step-foot { display: flex; gap: 10px; justify-content: space-between; align-items: center; margin-top: 28px; padding-top: 16px; border-top: 1px solid var(--hair); flex-wrap: wrap; }
.side { position: sticky; top: 76px; max-height: calc(100vh - 96px); display: flex; flex-direction: column; }
.setting { padding: 14px 0; border-bottom: 1px solid var(--hair); }
.setting:last-child { border-bottom: 0; }
.setting .head { display: flex; gap: 10px; align-items: baseline; justify-content: space-between; flex-wrap: wrap; }
.setting .title { font-weight: 650; }
.setting .more { margin-top: 8px; display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); max-width: 560px; }
details > summary { cursor: pointer; color: var(--accent-ink); font-size: 14px; }
details[open] > summary { margin-bottom: 6px; }
.explain { color: var(--ink-2); font-size: 14px; max-width: 70ch; }
.item { display: flex; gap: 12px; align-items: flex-start; padding: 12px 0; border-bottom: 1px solid var(--hair); }
.item:last-child { border-bottom: 0; }
.item .body { flex: 1; min-width: 0; }
.item .what { font-weight: 600; }
.bar { height: 8px; border-radius: 999px; background: var(--sunken); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 999px; }

/* ------------------------------------------------------------- assistant */
.chat { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding-right: 4px; min-height: 120px; }
.bubble { padding: 10px 12px; border-radius: 12px; background: var(--sunken); font-size: 14px; }
.bubble.me { background: var(--accent-wash); align-self: flex-end; max-width: 90%; }
.proposal { border: 1px solid var(--hair-strong); border-radius: 12px; padding: 10px 12px; background: var(--surface); font-size: 14px; }
.proposal.bad { border-color: color-mix(in srgb, var(--critical) 50%, transparent); }
.proposal .says { font-weight: 600; }
.proposal pre { white-space: pre-wrap; word-break: break-word; background: var(--sunken); padding: 8px; border-radius: 8px; margin: 6px 0 0; }

/* --------------------------------------------------------------- running */
.big { font-size: 22px; font-weight: 650; line-height: 1.3; }
.facts { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); }
.fact .k { color: var(--ink-2); font-size: 13px; } .fact .v { font-size: 20px; font-weight: 650; font-variant-numeric: tabular-nums; }
svg.chart { width: 100%; height: 170px; display: block; }
.toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); z-index: 50; max-width: min(640px, calc(100vw - 32px));
  background: var(--ink); color: var(--page); padding: 10px 16px; border-radius: 12px; box-shadow: var(--shadow); font-size: 14px; }
.toast.bad { background: var(--critical-ink); color: #fff; }
.toast[hidden] { display: none; }
dialog { border: 1px solid var(--hair); border-radius: 14px; background: var(--surface); color: var(--ink); max-width: min(520px, calc(100vw - 32px)); padding: 20px; box-shadow: var(--shadow); }
dialog::backdrop { background: rgba(0,0,0,.35); }

/* ------------------------------------------------------------ small screens */
@media (max-width: 1100px) {
  .wizard.with-side { grid-template-columns: 210px minmax(0, 1fr); }
  .wizard.with-side .side { grid-column: 2; position: static; max-height: none; }
}
@media (max-width: 760px) {
  main { padding: 16px 14px 80px; }
  .top-in { padding: 8px 14px; }
  .wizard, .wizard.with-side { grid-template-columns: 1fr; gap: 14px; }
  .wizard.with-side .side { grid-column: 1; }
  .rail { position: static; }
  .rail ol { display: flex; gap: 4px; overflow-x: auto; padding-bottom: 4px; }
  .rail li a { white-space: nowrap; padding: 6px 8px; }
  .rail li a .t { display: none; }
  .rail li a[aria-current="step"] .t { display: inline; }
  h1 { font-size: 22px; }
  .card { padding: 14px; }
  .crumbs .hide-small { display: none; }
  .step-foot .btn { flex: 1; }
}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <a class="brand" href="#/" aria-label="evolvekit, home">
      <svg width="26" height="26" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="var(--accent)"/><path d="M8 21l5-6 4 3 7-9" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>evolvekit</span>
    </a>
    <nav class="crumbs" id="crumbs" aria-label="Where you are"></nav>
    <div class="top-actions"><a class="btn quiet small" href="#/settings">Settings</a></div>
  </div>
</header>
<main id="view" tabindex="-1"></main>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<script>
"use strict";
/* =========================================================================
   evolvekit's app: one page, the JSON API, no build step, no network.
   ========================================================================= */

// ------------------------------------------------------------------ theme
(() => {
  const theme = new URLSearchParams(location.search).get("theme");
  if (theme === "dark" || theme === "light") document.documentElement.dataset.theme = theme;
})();

// ------------------------------------------------------------------ helpers
const $ = (sel, root = document) => root.querySelector(sel);
const view = $("#view");

function h(tag, attrs, ...children) {
  const el = document.createElement(tag);
  for (const [key, value] of Object.entries(attrs || {})) {
    if (value === null || value === undefined || value === false) continue;
    if (value === "" && (key === "disabled" || key === "checked" || key === "selected" || key === "hidden")) continue;
    if (key === "class") el.className = value;
    else if (key === "text") el.textContent = value;
    else if (key.startsWith("on") && typeof value === "function") el.addEventListener(key.slice(2), value);
    else if (key === "html") el.innerHTML = value;  // only ever given constant markup
    else if (value === true) el.setAttribute(key, "");
    else el.setAttribute(key, value);
  }
  for (const child of children.flat(Infinity)) {
    if (child === null || child === undefined || child === false) continue;
    el.append(child instanceof Node ? child : document.createTextNode(String(child)));
  }
  return el;
}

const ICONS = {
  ok: '<svg class="icon" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="9" fill="currentColor" opacity=".16"/><path d="M6 10.5l2.6 2.6L14 7.5" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  bad: '<svg class="icon" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="9" fill="currentColor" opacity=".16"/><path d="M7 7l6 6M13 7l-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',
  warn: '<svg class="icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 2.5l8 14H2z" fill="currentColor" opacity=".18"/><path d="M10 8v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="10" cy="14.6" r="1.1" fill="currentColor"/></svg>',
  info: '<svg class="icon" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="9" fill="currentColor" opacity=".16"/><path d="M10 9v5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="10" cy="6.2" r="1.1" fill="currentColor"/></svg>',
  draft: '<svg class="icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M4 14.5V16h1.5l8.6-8.6-1.5-1.5zM15.2 6.3l-1.5-1.5 1-1a1 1 0 011.5 1.5z" fill="currentColor"/></svg>',
  stop: '<svg class="icon" viewBox="0 0 20 20" aria-hidden="true"><rect x="5" y="5" width="10" height="10" rx="2" fill="currentColor"/></svg>',
};
function icon(name) { const span = h("span"); span.innerHTML = ICONS[name] || ""; return span.firstChild; }
function status(kind, text) { return h("span", { class: `status ${kind}` }, icon({ good: "ok", bad: "bad", warn: "warn", info: "info", none: "info" }[kind] || "info"), h("span", {}, text)); }
function note(kind, ...content) { return h("div", { class: `note ${kind}`, role: kind === "bad" ? "alert" : null }, icon({ good: "ok", bad: "bad", warn: "warn", info: "info" }[kind] || "info"), h("div", {}, ...content)); }
function fill(box, ...children) { box.replaceChildren(); put(box, ...children); }
function put(box, ...children) {
  for (const child of children.flat(Infinity)) if (child !== null && child !== undefined && child !== false && child !== "") box.append(child instanceof Node ? child : String(child));
}
function capital(text) { text = String(text || ""); return text ? text[0].toUpperCase() + text.slice(1) : text; }
function sentence(text) { text = capital(text).trim(); return text && !/[.!?]$/.test(text) ? text + "." : text; }
function plural(n, one, many) { return `${n} ${n === 1 ? one : (many || one + "s")}`; }
function fmt(value, digits = 4) {
  if (value === null || value === undefined || value === "") return "–";
  if (typeof value === "boolean") return value ? "on" : "off";
  if (typeof value !== "number") return String(value);
  if (!isFinite(value)) return "–";
  const abs = Math.abs(value);
  if (abs !== 0 && (abs >= 1e6 || abs < 1e-3)) return value.toPrecision(3);

function dropZone(el, onFiles) {

async function droppedFiles(transfer) {
  // Folders are walked in the browser: every file inside, however deep.
  const items = [...(transfer.items || [])].map((i) => i.webkitGetAsEntry && i.webkitGetAsEntry()).filter(Boolean);
  if (!items.length) return [...(transfer.files || [])];
  const files = [];
  async function walk(entry) {
    if (entry.isFile) files.push(await new Promise((ok, fail) => entry.file(ok, fail)));
    else if (entry.isDirectory) {
      const reader = entry.createReader();
      let batch;
      do { batch = await new Promise((ok, fail) => reader.readEntries(ok, fail)); for (const child of batch) await walk(child); } while (batch.length);
    }
  }
  for (const entry of items) await walk(entry);
  return files;
}

function smallestTraining(doc) {
  const training = doc.cases.filter((c) => c.set === "training");
  return training.length ? training.reduce((a, b) => (b.bytes < a.bytes ? b : a)) : null;
}
function previewLine(doc) {
  const p = doc.preview || {};
  if (p.state === "running") return h("div", { class: "row muted small" }, h("span", { class: "spinner" }), "The preview is running: the smallest case is being solved once at the starting values.");
  if (p.state === "failed" || p.state === "interrupted") return note("bad", h("p", { style: "margin:0" }, `The preview did not work: ${sentence(p.error || (p.result || {}).error || "no reason given")}`));

}

  if (p.state !== "running" && stale) await api("POST", studyPath("/preview"));
}

function settingControl(setting, choice, onChange) {

      setting.type !== "bool" && setting.type !== "choice" ? h("span", { class: "faint" }, `(allowed ${fmt(setting.low)} to ${fmt(setting.high)})`) : null));
  }

      h("div", { class: "muted small" }, setting.help)), seg),
    details,
    h("details", {}, h("summary", {}, "Why would I tune this?"), h("p", { class: "explain" }, setting.explain || setting.help),
      h("p", { class: "faint" }, `Its name in ${current.harness.title}: `, h("code", {}, name), `; its default: ${fmt(setting.default)}.`)));

// ============================================================== assistant
function assistantPanel() {
  const slug = current.slug;
  const panel = h("aside", { class: "side card", "aria-label": "Assistant" });
  const log = h("div", { class: "chat", "aria-live": "polite" });
  const input = h("textarea", { id: "ask", placeholder: "Say what you want in your own words, e.g. “count late deliveries to frozen customers”", style: "min-height:70px" });
  const ask = h("button", { class: "btn primary", type: "button" }, "Ask");
  const cost = h("p", { class: "faint", style: "margin:6px 0 0" });
  panel.append(h("h3", { style: "margin-top:0" }, "Assistant"),
    h("p", { class: "faint", style: "margin-top:0" }, "It sees the tables' structure and summaries of the preview case — never rows, names, addresses or coordinates."),
    log, h("label", { for: "ask", class: "sr" }, "Ask the assistant"), input, h("div", { class: "row", style: "margin-top:8px" }, ask), cost);

  function bubble(text, me) { log.append(h("div", { class: "bubble" + (me ? " me" : "") }, text)); log.scrollTop = log.scrollHeight; }
  function proposal(card) {
    const kindText = { kpi: "A measure", data_change: "A data change", constraint: "A rule", setting: "A setting", weighted: "A combination", goal: "The goal", guardrail: "A guardrail" }[card.kind] || card.kind;
    const detail = card.sql || card.expr || (card.kind === "data_change" ? `${card.lever} · ${card.column || "in code"} · where ${card.where || "all rows"} · ${card.mode} ${card.low}–${card.high}` : "")
      || (card.kind === "goal" ? card.levels.map((l) => `${l.kpi} ${l.direction}${l.equal_within ? " within " + l.equal_within : ""}`).join(" → ") : "")
      || (card.kind === "guardrail" ? `${card.kpi} ${card.max !== undefined ? "≤ " + card.max : "≥ " + card.min}` : "")
      || (card.kind === "weighted" ? Object.entries(card.weighted || {}).map(([k, w]) => `${w} × ${k}`).join(" + ") : "")
      || (card.kind === "setting" ? `${card.name}: ${card.mode}` : "");
    const facts = card.ok ? [card.value !== undefined ? `On the preview case: ${fmt(card.value)}.` : null, card.applies_to !== undefined ? `Applies to ${plural(card.applies_to, "row")}.` : null,
      card.holds_today ? "Holds today." : null].filter(Boolean).join(" ") : "";
    const el = h("div", { class: "proposal" + (card.ok ? "" : " bad") },
      h("div", { class: "faint" }, kindText), h("div", { class: "says" }, card.says || card.name || kindText),
      detail ? h("pre", { class: "mono" }, detail) : null,
      card.ok ? (facts ? h("p", { class: "small", style: "margin:6px 0 0" }, facts) : null) : h("p", { class: "small", style: "margin:6px 0 0; color: var(--critical-ink)" }, card.problem));
    if (card.ok) {
      const add = h("button", { class: "btn small primary", type: "button", onclick: () => guarded(async () => {
        const answer = await api("POST", `/api/studies/${encodeURIComponent(slug)}/cards`, { card });
        current.doc = answer.study; add.replaceWith(status("good", "Added")); edit.remove(); dismiss.remove();
        if (current.redraw) current.redraw();
      }, add) }, "Add");
      const edit = card.kind === "kpi" && current.fillSql ? h("button", { class: "btn small", type: "button", onclick: () => current.fillSql(card) }, "Edit") : h("span");
      const dismiss = h("button", { class: "btn small quiet", type: "button", onclick: () => el.remove() }, "Dismiss");
      el.append(h("div", { class: "row", style: "margin-top:8px" }, add, edit, dismiss));
    }
    log.append(el); log.scrollTop = log.scrollHeight;
  }
  ask.addEventListener("click", () => guarded(async () => {
    const message = input.value.trim(); if (!message) return;
    bubble(message, true); input.value = "";
    const thinking = h("div", { class: "row muted small" }, h("span", { class: "spinner" }), "Thinking… (checking every proposal on the preview case)");
    log.append(thinking);
    try {
      const answer = await api("POST", `/api/studies/${encodeURIComponent(slug)}/assistant`, { message });
      thinking.remove();
      if (answer.needs_key) { log.append(note("info", h("p", { style: "margin:0" }, answer.say, " ", h("a", { href: "#/settings" }, "Settings")))); return; }
      if (answer.say) bubble(answer.say);
      for (const card of answer.cards) proposal(card);
      cost.textContent = `This answer cost $${fmt(answer.usd, 3)}; this study's assistant, $${fmt(answer.total_usd, 3)} so far.`;
    } catch (err) { thinking.remove(); throw err; }
  }, ask));
  input.addEventListener("keydown", (e) => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) ask.click(); });
  api("GET", `/api/studies/${encodeURIComponent(slug)}/assistant`).then((history) => {
    for (const turn of history.turns.slice(-6)) turn.role === "user" ? bubble(turn.text, true) : (turn.say ? bubble(turn.say) : null);
    if (history.total_usd) cost.textContent = `This study's assistant has cost $${fmt(history.total_usd, 3)} so far.`;
    if (!history.turns.length) log.append(h("p", { class: "muted small", style: "margin:0" }, "For example: “a measure for late deliveries to VIP customers”, or “try cheaper vans and dearer trucks, trucks must stay dearer”."));
  }).catch(() => {});
  return panel;
}

// ================================================================ running
function chart(series) {
  const points = series.filter(([t, v]) => t !== null && v !== null);
  if (points.length < 2) return h("p", { class: "muted small" }, "The chart appears after the first rounds.");
  const W = 600, H = 170, pad = 30;
  const xs = points.map((p) => p[0]), ys = points.map((p) => p[1]);
  const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(0, ...ys), y1 = Math.max(0.5, ...ys);
  const X = (t) => pad + (W - 2 * pad) * (x1 === x0 ? 1 : (t - x0) / (x1 - x0));
  const Y = (v) => H - pad + ((H - 2 * pad) * -(v - y0)) / (y1 - y0 || 1);
  const path = points.map(([t, v], i) => `${i ? "L" : "M"}${X(t).toFixed(1)},${Y(v).toFixed(1)}`).join("");
  const svg = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="The best improvement over time, from ${fmt(ys[0])} % to ${fmt(ys[ys.length - 1])} %">
    <line x1="${pad}" y1="${Y(0).toFixed(1)}" x2="${W - pad}" y2="${Y(0).toFixed(1)}" stroke="var(--axis)" stroke-dasharray="4 4"/>
    <text x="${pad}" y="${Y(0) - 6}" font-size="11" fill="var(--ink-3)">starting point</text>
    <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>
    ${points.map(([t, v]) => `<circle cx="${X(t).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="3" fill="var(--accent)"/>`).join("")}
    <text x="${W - pad}" y="${H - 8}" font-size="11" fill="var(--ink-3)" text-anchor="end">${duration(x1)} of search</text>
    <text x="${pad}" y="14" font-size="11" fill="var(--ink-3)">% better than the start</text></svg>`;
  const wrap = h("div"); wrap.innerHTML = svg; return wrap;
}

      h("div", { class: "card" },
        h("div", { class: "facts" },
          h("div", { class: "fact" }, h("div", { class: "k" }, "Time used"), h("div", { class: "v" }, s.time.used || "–")),
          h("div", { class: "fact" }, h("div", { class: "k" }, "Time left"), h("div", { class: "v" }, running ? (s.time.left || "–") : "–")),
          h("div", { class: "fact" }, h("div", { class: "k" }, "Done around"), h("div", { class: "v" }, running ? (s.time.finish_at || "–") : "–")),
          h("div", { class: "fact" }, h("div", { class: "k" }, "Rounds done"), h("div", { class: "v" }, `${s.rounds.done} of about ${planned}`))),
        h("div", { class: "bar", style: "margin-top:12px", role: "progressbar", "aria-valuemin": "0", "aria-valuemax": String(planned), "aria-valuenow": String(s.rounds.done), "aria-label": "Rounds done" },
          h("i", { style: `width:${Math.min(100, (100 * s.rounds.done) / planned)}%` }))),
      h("div", { class: "card" }, h("h2", { style: "margin-top:0" }, "The best so far"), h("p", { class: "big" }, s.best.line),
        s.best.levels ? h("div", { class: "table-wrap" }, h("table", {}, h("thead", {}, h("tr", {}, h("th", {}, "Level"), h("th", {}, "Measure"), h("th", { class: "n" }, "Start"), h("th", { class: "n" }, "Best"), h("th", {}, "Verdict"))),
          h("tbody", {}, s.best.levels.map((l) => h("tr", {}, h("td", {}, String(l.level)), h("td", {}, kpiLabel(l.kpi)), h("td", { class: "n" }, fmt(l.baseline)), h("td", { class: "n" }, fmt(l.best)), h("td", {}, l.state || "–")))))) : null,
        chart(s.series)),
      s.now ? h("div", { class: "card" }, h("h2", { style: "margin-top:0" }, "Right now"), h("p", {}, s.now)) : null,
      s.gated_line ? note("info", h("p", { style: "margin:0" }, s.gated_line)) : null,
      s.failures.length ? h("div", { class: "card" }, h("h2", { style: "margin-top:0" }, "Runs that failed"),
        s.failures.map((f) => h("div", { class: "item" }, h("span", { class: "badge" }, `${f.count}×`), h("div", { class: "body" }, h("div", { class: "what small" }, sentence(f.message)), h("div", { class: "muted small" }, f.todo))))) : null,
      h("div", { class: "step-foot" }, h("a", { class: "btn", href: s.dashboard, target: "_blank", rel: "noopener" }, "Detailed dashboard"),
        running ? stop : h("div", { class: "row" },
          s.can_check ? h("button", { class: "btn", type: "button", onclick: (e) => guarded(async () => { await api("POST", studyPath("/final-check")); toast("The final check runs again."); draw(); }, e.currentTarget) }, "Run the final check again") : null,
          s.phase === "failed" ? h("button", { class: "btn", type: "button", onclick: (e) => guarded(async () => { await api("POST", studyPath("/start")); toast("Started again."); stopping = false; clearTimers(); every(2500, draw); draw(); }, e.currentTarget) }, "Start it again") : null,
          s.phase === "failed" && !s.rounds.done ? null : h("a", { class: "btn primary", href: `#/study/${slug}/results` }, "See the results"))));
    if (!running) clearTimers();
  }
  await draw();
  every(2500, draw);
}

// ================================================================ results
async function renderResults(slug, run) {
  await loadStudy(slug, true);
  crumbs({ href: "#/", text: "Your studies", small: true }, { href: `#/study/${slug}/7`, text: current.doc.study.name, small: true }, { text: "Results" });
  let r;
  try { r = await api("GET", studyPath("/results" + (run ? `?run=${encodeURIComponent(run)}` : ""))); }
  catch (err) {
    if (err.status === 404) { view.replaceChildren(note("info", h("p", {}, "This study has not been run yet. "), h("a", { href: `#/study/${slug}/7` }, "Review and start it"))); return; }
    throw err;
  }
  const running = ["starting", "search", "check"].includes(r.phase);
  const finalKind = { confirmed: "good", worse: "bad", unclear: "warn", single: "info", skipped: "info", stopped: "warn", missing: "info" }[r.final.state] || "info";
  const unitOf = (k) => k.unit ? ` ${k.unit}` : "";
  const kpiTable = h("div", { class: "table-wrap" }, h("table", {},
    h("thead", {}, h("tr", {}, h("th", {}, "Measure"), h("th", { class: "n" }, "Start"), h("th", { class: "n" }, "Best"), h("th", { class: "n" }, "Start, held back"), h("th", { class: "n" }, "Best, held back"))),
    h("tbody", {}, r.kpis.map((k) => h("tr", {}, h("td", {}, k.says, h("div", { class: "faint" }, `${k.direction === "lower" ? "lower" : "higher"} is better${unitOf(k) ? " ·" + unitOf(k) : ""}`)),
      h("td", { class: "n" }, fmt(k.training.start, 2)), h("td", { class: "n" }, h("strong", {}, fmt(k.training.best, 2))), h("td", { class: "n" }, fmt(k.test.start, 2)), h("td", { class: "n" }, h("strong", {}, fmt(k.test.best, 2))))))));
  const changed = h("div", { class: "table-wrap" }, h("table", {},
    h("thead", {}, h("tr", {}, h("th", {}, "What"), h("th", {}, "Before"), h("th", {}, "Now"))),
    h("tbody", {}, r.changed.map((c) => h("tr", {}, h("td", {}, c.label, h("div", { class: "faint" }, c.help)), h("td", { class: "num" }, c.old_text), h("td", { class: "num" }, c.changed ? h("strong", {}, c.new_text) : c.new_text))))));
  const downloads = h("div", { class: "row" }, r.downloads.map((d) => h("a", { class: "btn" + (d.name === "settings_json" || d.name === "data_changes" ? " primary" : ""), href: `${studyPath("/download/" + d.name)}?run=${encodeURIComponent(r.run)}`, download: "" }, d.label)));
  const next = h("button", { class: "btn", type: "button", onclick: (e) => guarded(async () => {
    const doc = await api("POST", studyPath(`/next?run=${encodeURIComponent(r.run)}`), { name: `${current.doc.study.name} (next)` });
    location.hash = `#/study/${doc.slug}/4`;
  }, e.currentTarget) }, "Start a new study from this result");
  view.replaceChildren(h("div", { class: "narrow" },
    h("h1", {}, r.study),
    running ? note("info", h("p", { style: "margin:0" }, "The study is still running; these are the results so far. ", h("a", { href: `#/study/${slug}/running` }, "See it run"))) : null,
    h("div", { class: "card" }, h("p", { class: "big", style: "margin:0" }, r.headline)),
    h("h2", {}, "The final check"),
    h("div", { class: "card" }, status(finalKind, { good: "Confirmed", bad: "Worse", warn: "Not clear", info: "Note" }[finalKind]), h("p", { style: "margin:8px 0 0" }, r.final.line),
      r.final.levels ? h("ul", { class: "small" }, r.final.levels.map((l) => h("li", {}, `${kpiLabel(l.kpi)}: ${l.verdict || l.state || ""}`))) : null),
    h("h2", {}, "Every measure"), h("div", { class: "card" }, kpiTable,
      r.guardrails.length ? h("p", { class: "faint" }, "Guardrails: ", r.guardrails.map((g) => `${kpiLabel(g.kpi)} ${g.max !== null && g.max !== undefined ? "at most " + fmt(g.max) : "at least " + fmt(g.min)}`).join("; "), ".") : null),
    h("h2", {}, "What changed"), h("div", { class: "card" }, r.is_seed ? h("p", { class: "muted" }, "Nothing: no combination beat the starting point.") : changed),
    h("h2", {}, "Take it with you"), h("div", { class: "card" }, downloads, h("p", { class: "faint" }, "The settings file holds every setting, the tuned ones included, ready for the application.")),
    h("h2", {}, "Next steps"), h("div", { class: "card" }, h("p", { class: "muted" }, "Search again from here: the same cases and choices, starting from this result."), next)));
}

route();
</script>
