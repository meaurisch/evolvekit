title: Higher scores by changing the prompt
summary: Let the search change the system prompt and check on held-back items whether the scores rise.
vary:
  code:
    from: HEAD
    brief: Make the answers score higher on the evaluation items.
kpis:
  score: {from: harness}
goal:
  levels:
    - {kpi: score, direction: higher}
# A demo is quick: six minutes in all, and at most half a dollar of AI search
# help once it is turned on (a code study needs it).
budget:
  hours: 0.1
  ai: {enabled: false, max_usd: 0.5}
