title: Stop weights → a shorter real tour
summary: Try weights on the northern stops and see whether the solver then finds shorter tours.
vary:
  data:
    north_weight:
      lever: stop_weights
      column: weight
      where: "tag = 'north'"
      mode: scale
      low: 0.5
      high: 2.0
      start: 1.0
kpis:
  tour_length: {from: harness}
  longest_leg: {from: harness}
goal:
  levels:
    - {kpi: tour_length, direction: lower}
